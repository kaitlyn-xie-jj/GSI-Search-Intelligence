site_name: GSI
site_description: GSI project documentation
docs_dir: docs
exclude_docs: |
  /SGI_Architecture_Document.md
  /architecture.md
  /baseline_comparison.md
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
extra:
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 中文
      link: /zh/
      lang: zh
nav:
  - Home: index.md
  - English Documentation:
      - Home: en/index.md
      - Getting Started:
          - Overview: en/getting-started/overview.md
          - Installation and Environment: en/getting-started/installation.md
          - Quick Start: en/getting-started/quickstart.md
          - Reproduce Results: en/getting-started/reproduce-results.md
      - Concepts:
          - Architecture: en/concepts/architecture.md
          - Task and State: en/concepts/task-and-state.md
          - Planner / Validator / Solver: en/concepts/planner-validator-solver.md
          - Replan and New Case: en/concepts/replan-newcase.md
          - Evaluation Metrics: en/concepts/evaluation-metrics.md
      - Tutorials:
          - Run a Single Task: en/tutorials/run-single-task.md
          - Run Benchmark: en/tutorials/run-benchmark.md
          - Use Hugging Face Models and Data: en/tutorials/use-hf-models-datasets.md
          - Collect Replan Data: en/tutorials/collect-replan-data.md
          - Evaluate a Model: en/tutorials/evaluate-model.md
      - Training and Models:
          - Training Overview: en/training/overview.md
          - Hugging Face Preparation: en/training/huggingface-prepare.md
          - SFT Training: en/training/sft.md
          - RLVR Training: en/training/rlvr.md
          - vLLM Evaluation: en/training/vllm-eval.md
          - Output Directory: en/training/outputs.md
      - Development:
          - Repository Layout: en/development/repo-layout.md
          - Add a Task: en/development/add-new-task.md
          - Add a Solver Backend: en/development/add-new-solver-backend.md
          - Add a Planner Backend: en/development/add-new-planner-backend.md
          - Add a Validator Rule: en/development/add-new-validator-rule.md
          - Development Guidelines: en/development/coding-guidelines.md
      - Reference:
          - Configuration: en/reference/config.md
          - CLI and Scripts: en/reference/cli.md
          - Environment Variables: en/reference/environment-variables.md
          - Data Format: en/reference/data-format.md
          - Models and Datasets: en/reference/models-and-datasets.md
      - Troubleshooting:
          - GPU and vLLM: en/troubleshooting/gpu-and-vllm.md
          - Ray and Checkpoint: en/troubleshooting/ray-and-checkpoint.md
          - Solver: en/troubleshooting/solver.md
          - Hugging Face Cache: en/troubleshooting/huggingface-cache.md
          - Training Failures: en/troubleshooting/training-failures.md
