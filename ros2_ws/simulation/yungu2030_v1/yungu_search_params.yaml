gsi_search_node:
  ros__parameters:
    use_sim_time: true
    target_query: yellow-van
    area_id: yungu2030_local_origin
    area_min_x_m: -4.835387
    area_min_y_m: -10.610370
    area_max_x_m: 324.729980
    area_max_y_m: 210.563126
    grid_resolution_m: 10.0
    flight_altitude_m: 30.0
    sensor_footprint_radius_m: 30.0
    max_viewpoints: 60
    search_time_budget_s: 1000.0
    min_confirmations: 2
    max_localization_error_m: 8.0
    verification_followup_limit: 1
    verification_max_horizontal_offset_m: 1.0
    semantic_map_path: /workspace/VisionFlow-PX4/Tools/simulation/gz/worlds/yungu2030_semantic_map.json
    search_prior_path: simulation/yungu2030_v1/yungu_search_prior.json
    sensor_detection_probability: 0.85
    sensor_false_positive_probability: 0.01
    active_detection_weight: 1.0
    active_information_gain_weight: 1.0
    active_novelty_weight: 0.35
    active_travel_weight: 0.1
    active_revisit_weight: 0.2
    active_risk_weight: 0.25
    active_belief_lookahead_enabled: true
    active_lookahead_discount_factor: 0.7
    active_lookahead_candidate_limit: 16
    active_candidate_exploitation_fraction: 0.3
    active_candidate_exploration_fraction: 0.4
    active_candidate_semantic_fraction: 0.3
    active_candidate_frontier_fraction: 0.5
    active_planning_speed_mps: 1.0
    active_completion_time_reserve_s: 5.0
    # Half a grid cell is sufficient for a 40 m nadir footprint and avoids
    # treating PX4's slow final position convergence as a failed viewpoint.
    position_tolerance_m: 5.0
    velocity_tolerance_mps: 0.5
    settle_time_s: 1.0
    goal_republish_interval_s: 0.5
    progress_log_interval_s: 5.0
    # Headless Yungu rendering has an observed RGB cadence below the nominal
    # 10 Hz. Keep each observation valid across the measured frame jitter.
    sensor_timeout_s: 3.0
    maximum_sensor_skew_s: 3.0
    minimum_observation_quality: 0.5
    minimum_negative_observation_quality: 0.5
    # At 30 m, unobstructed frames yielded roughly 2,000-3,000 projected
    # ground samples.  Treat lower support as a partially blocked view.
    minimum_projected_ground_points: 2000
    require_detections: true
    require_point_cloud: true
    record_first_positive_detection_in_transit: true
    transit_detection_max_sensor_skew_s: 1.0
    transit_detection_min_observation_quality: 0.5
    record_negative_observations_in_transit: true
    transit_negative_min_interval_s: 2.0
    transit_negative_min_distance_m: 5.0
    transit_negative_min_new_cells: 3
    transit_suspect_min_belief: 0.004
    transit_suspect_inspection_limit: 2
    transit_suspect_min_angle_rad: 1.570796
    transit_suspect_snapshot_dir: /tmp/GSI/results/yungu2030_sensor_validation/suspect_snapshots
    transit_suspect_snapshot_limit: 20
    verification_snapshot_dir: /tmp/GSI/results/yungu2030_sensor_validation/verification_snapshots
    verification_snapshot_limit: 20
    replan_min_interval_s: 20.0
    replan_belief_total_variation_threshold: 0.1
    replan_kl_divergence_threshold_nats: 0.05
    replan_expected_reward_change_threshold: 0.2
    detections_in_map_frame: true
    map_origin_x_m: 42.0
    map_origin_y_m: 90.0
    map_origin_z_m: 0.0
    camera_translation_x_m: 0.12
    camera_translation_y_m: 0.0
    camera_translation_z_m: -0.05
    camera_roll_rad: 0.0
    camera_pitch_rad: 1.570796
    camera_yaw_rad: 0.0
    ground_plane_z_m: 0.0
    ground_tolerance_m: 0.35
    visibility_point_resolution_m: 0.5
    pointcloud_sample_limit: 10000
    pointcloud_maximum_range_m: 90.0
    pointcloud_frame_id: gsi_rgbd_link
    odom_topic: /mavros/local_position/odom
    imu_topic: /mavros/imu/data
    rgb_topic: /oakd1/rgb/image
    camera_info_topic: /oakd1/rgb/camera_info
    depth_topic: /oakd1/depth/image
    point_cloud_topic: /oakd1/depth/points
    detections_topic: /gsi/detections
    battery_topic: /mavros/battery
    goal_pose_topic: /gsi/uav/goal_pose
    outcome_topic: /gsi/search/outcome
    trace_output_path: /tmp/GSI/results/yungu2030_sensor_validation/search_trace.jsonl

gsi_mavros_offboard_controller:
  ros__parameters:
    use_sim_time: true
    state_topic: /mavros/state
    odom_topic: /mavros/local_position/odom
    goal_pose_topic: /gsi/uav/goal_pose
    setpoint_topic: /mavros/setpoint_position/local
    arming_service: /mavros/cmd/arming
    set_mode_service: /mavros/set_mode
    map_frame: map
    map_origin_x_m: 42.0
    map_origin_y_m: 90.0
    map_origin_z_m: 0.0
    setpoint_rate_hz: 20.0
    prestream_setpoint_count: 100
    request_interval_s: 2.0
    auto_offboard: true
    auto_arm: true
    staged_takeoff: true
    takeoff_altitude_tolerance_m: 0.5
    # PX4's official position controller owns trajectory generation. The
    # Yungu airframe limits speed, acceleration, and tilt for long search legs.
    horizontal_setpoint_speed_mps: 0.0
    horizontal_setpoint_max_lead_m: 0.0

gsi_color_target_detector:
  ros__parameters:
    use_sim_time: true
    rgb_topic: /oakd1/rgb/image
    rgb_camera_info_topic: /oakd1/rgb/camera_info
    depth_topic: /oakd1/depth/image
    depth_camera_info_topic: /oakd1/depth/camera_info
    odom_topic: /mavros/local_position/odom
    detections_topic: /gsi/detections
    target_label: yellow-van
    target_entity_id: yellow-search-van
    detection_rate_hz: 5.0
    sensor_timeout_s: 3.0
    minimum_red: 150
    minimum_green: 120
    maximum_blue: 120
    minimum_yellow_margin: 60
    maximum_red_green_difference: 100
    # 160x120, 60 deg HFOV and a 1.6x0.8 m roof at 30 m project to about
    # 8x4=32 pixels.  Require 18 threshold-qualified pixels (~56% of that area)
    # to tolerate shading/antialiasing without accepting tiny speckles.
    minimum_pixels: 18
    depth_window_radius_px: 6
    minimum_depth_m: 0.2
    maximum_depth_m: 90.0
    map_origin_x_m: 42.0
    map_origin_y_m: 90.0
    map_origin_z_m: 0.0
    camera_translation_x_m: 0.12
    camera_translation_y_m: 0.0
    camera_translation_z_m: -0.05
    camera_roll_rad: 0.0
    camera_pitch_rad: 1.570796
    camera_yaw_rad: 0.0
