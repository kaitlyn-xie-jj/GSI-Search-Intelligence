gsi_search_node:
  ros__parameters:
    use_sim_time: true
    target_query: car
    search_policy: coverage
    area_id: yungu2030_local_origin
    # Flat north road connector beside the central buildings. Its semantic
    # elevation is 0.27-0.30 m; unlike the adjacent sunken plaza, a single
    # ground plane is valid across this entire demonstration rectangle.
    area_min_x_m: 90.0
    area_min_y_m: 57.0
    area_max_x_m: 140.0
    area_max_y_m: 72.0
    # Search bounds and navigation bounds are deliberately separate: the UAV
    # starts at (42, 90), outside the courtyard search rectangle, and must fly
    # through the full known-safe map to reach its closest sweep endpoint.
    navigation_bounds_enabled: true
    navigation_min_x_m: -4.835387
    navigation_min_y_m: -10.610370
    navigation_max_x_m: 324.729980
    navigation_max_y_m: 210.563126
    grid_resolution_m: 7.0
    flight_altitude_m: 15.0
    # Zero selects a rectangular footprint computed from altitude and camera
    # intrinsics. A positive value remains available as a legacy circle override.
    sensor_footprint_radius_m: 0.0
    camera_horizontal_fov_rad: 1.0472
    camera_image_width_px: 160
    camera_image_height_px: 120
    planning_footprint_scale: 0.95
    # Full-map audit: 622 primary poses plus at most 1908 safe recovery
    # candidates when every observation is inconclusive.
    max_viewpoints: 3000
    search_time_budget_s: 12000.0
    min_confirmations: 2
    max_localization_error_m: 8.0
    verification_followup_limit: 1
    # Move essentially directly above the localized target. The tiny non-zero
    # offset keeps the coverage policy's follow-up hook enabled.
    verification_max_horizontal_offset_m: 0.01
    operator_confirmation_enabled: true
    operator_confirmation_topic: /gsi/operator_confirmation
    semantic_map_path: /workspace/VisionFlow-PX4/Tools/simulation/gz/worlds/yungu2030_semantic_map.json
    search_prior_path: simulation/yungu2030_v1/yungu_search_prior.json
    sensor_detection_probability: 0.85
    sensor_false_positive_probability: 0.01
    active_detection_weight: 1.0
    active_information_gain_weight: 1.0
    active_novelty_weight: 0.35
    active_travel_weight: 0.1
    active_revisit_weight: 0.2
    active_risk_weight: 0.25
    active_belief_lookahead_enabled: true
    active_lookahead_discount_factor: 0.7
    active_lookahead_candidate_limit: 16
    active_candidate_exploitation_fraction: 0.3
    active_candidate_exploration_fraction: 0.4
    active_candidate_semantic_fraction: 0.3
    active_candidate_frontier_fraction: 0.5
    active_planning_speed_mps: 1.5
    active_completion_time_reserve_s: 5.0
    # Deterministic lawn-mower route. At 15 m the scaled footprint is roughly
    # 16.45 x 12.34 m, so 7 m keeps generous overlap in both directions.
    coverage_pass_spacing_m: 7.0
    coverage_observation_spacing_m: 7.0
    # The current airframe has a fixed nadir camera. A later gimbal/dual-camera
    # change is required before this can truthfully become -0.785398 (45 deg).
    coverage_camera_pitch_rad: -1.570796
    coverage_start_from_nearest_endpoint: true
    # After the primary route, revisit cells that never received a sufficiently
    # clear observation. Alternate viewpoints approach each gap from four sides.
    coverage_recovery_enabled: true
    coverage_recovery_min_quality: 0.5
    coverage_recovery_offset_m: 4.0
    # Half a grid cell is sufficient for a 40 m nadir footprint and avoids
    # treating PX4's slow final position convergence as a failed viewpoint.
    position_tolerance_m: 5.0
    velocity_tolerance_mps: 0.5
    settle_time_s: 1.0
    goal_republish_interval_s: 0.5
    progress_log_interval_s: 5.0
    # Headless Yungu rendering has an observed RGB cadence below the nominal
    # 10 Hz. Keep each observation valid across the measured frame jitter.
    sensor_timeout_s: 3.0
    maximum_sensor_skew_s: 3.0
    minimum_observation_quality: 0.5
    minimum_negative_observation_quality: 0.5
    # The 160x120 nadir sensor produced roughly 300-430 valid road-plane
    # samples per settled view in the latest SITL run. Require 200 so a valid
    # flat-road observation is accepted while sparse edge projections are not.
    minimum_projected_ground_points: 200
    # Keep the 15 m inspection altitude, but route horizontally around every
    # building whose roof is not safely below the commanded flight segment.
    building_route_planning_enabled: true
    building_horizontal_clearance_m: 3.0
    building_vertical_clearance_m: 2.0
    building_corner_offset_m: 0.1
    require_detections: true
    require_point_cloud: true
    record_first_positive_detection_in_transit: true
    transit_detection_max_sensor_skew_s: 1.0
    transit_detection_min_observation_quality: 0.5
    record_negative_observations_in_transit: true
    transit_negative_min_interval_s: 2.0
    transit_negative_min_distance_m: 5.0
    transit_negative_min_new_cells: 3
    transit_suspect_min_belief: 0.004
    transit_suspect_inspection_limit: 2
    transit_suspect_min_angle_rad: 1.570796
    transit_suspect_snapshot_dir: /tmp/GSI/results/yungu2030_sensor_validation/suspect_snapshots
    transit_suspect_snapshot_limit: 20
    verification_snapshot_dir: /tmp/GSI/results/yungu2030_sensor_validation/verification_snapshots
    verification_snapshot_limit: 20
    replan_min_interval_s: 20.0
    replan_belief_total_variation_threshold: 0.1
    replan_kl_divergence_threshold_nats: 0.05
    replan_expected_reward_change_threshold: 0.2
    detections_in_map_frame: true
    map_origin_x_m: 42.0
    map_origin_y_m: 90.0
    map_origin_z_m: 0.0
    camera_translation_x_m: 0.12
    camera_translation_y_m: 0.0
    camera_translation_z_m: -0.05
    camera_roll_rad: 0.0
    camera_pitch_rad: 1.570796
    camera_yaw_rad: 0.0
    ground_plane_z_m: 0.28
    ground_tolerance_m: 0.35
    visibility_point_resolution_m: 0.5
    pointcloud_sample_limit: 10000
    pointcloud_maximum_range_m: 90.0
    pointcloud_frame_id: gsi_rgbd_link
    odom_topic: /mavros/local_position/odom
    imu_topic: /mavros/imu/data
    rgb_topic: /oakd1/rgb/image
    camera_info_topic: /oakd1/rgb/camera_info
    depth_topic: /oakd1/depth/image
    point_cloud_topic: /oakd1/depth/points
    detections_topic: /gsi/detections
    battery_topic: /mavros/battery
    goal_pose_topic: /gsi/uav/goal_pose
    outcome_topic: /gsi/search/outcome
    safety_status_topic: /gsi/uav/safety_status
    trace_output_path: /tmp/GSI/results/yungu2030_sensor_validation/search_trace.jsonl

gsi_mavros_offboard_controller:
  ros__parameters:
    use_sim_time: true
    state_topic: /mavros/state
    odom_topic: /mavros/local_position/odom
    goal_pose_topic: /gsi/uav/goal_pose
    setpoint_topic: /mavros/setpoint_position/local
    arming_service: /mavros/cmd/arming
    set_mode_service: /mavros/set_mode
    map_frame: map
    map_origin_x_m: 42.0
    map_origin_y_m: 90.0
    map_origin_z_m: 0.0
    setpoint_rate_hz: 20.0
    prestream_setpoint_count: 100
    request_interval_s: 2.0
    auto_offboard: true
    auto_arm: true
    staged_takeoff: true
    takeoff_altitude_tolerance_m: 0.5
    # PX4's official position controller owns trajectory generation. The
    # Yungu airframe limits speed, acceleration, and tilt for long search legs.
    horizontal_setpoint_speed_mps: 0.0
    horizontal_setpoint_max_lead_m: 0.0
    # PX4 local odometry must agree with the Gazebo spawn before any setpoint
    # streaming or arming request. This rejects stale estimator state such as
    # the observed false initial altitude of 81.38 m.
    initial_pose_expected_x_m: 0.0
    initial_pose_expected_y_m: 0.0
    initial_pose_expected_z_m: 0.25
    initial_pose_horizontal_tolerance_m: 2.0
    initial_pose_vertical_tolerance_m: 1.0
    initial_pose_max_speed_mps: 1.0
    # Require a sustained stable estimator state, not a handful of startup
    # samples, before setpoint streaming and automatic arming can begin.
    initial_pose_required_samples: 100
    safety_area_min_x_m: -4.835387
    safety_area_min_y_m: -10.610370
    safety_area_max_x_m: 324.729980
    safety_area_max_y_m: 210.563126
    safety_area_margin_m: 5.0
    safety_status_topic: /gsi/uav/safety_status

gsi_color_target_detector:
  ros__parameters:
    use_sim_time: true
    rgb_topic: /oakd1/rgb/image
    rgb_camera_info_topic: /oakd1/rgb/camera_info
    depth_topic: /oakd1/depth/image
    depth_camera_info_topic: /oakd1/depth/camera_info
    odom_topic: /mavros/local_position/odom
    detections_topic: /gsi/detections
    target_label: yellow-van
    target_entity_id: yellow-search-van
    detection_rate_hz: 5.0
    sensor_timeout_s: 3.0
    minimum_red: 150
    minimum_green: 120
    maximum_blue: 120
    minimum_yellow_margin: 60
    maximum_red_green_difference: 100
    # 160x120, 60 deg HFOV and a 1.6x0.8 m roof at 30 m project to about
    # 8x4=32 pixels.  Require 18 threshold-qualified pixels (~56% of that area)
    # to tolerate shading/antialiasing without accepting tiny speckles.
    minimum_pixels: 18
    depth_window_radius_px: 6
    minimum_depth_m: 0.2
    maximum_depth_m: 90.0
    map_origin_x_m: 42.0
    map_origin_y_m: 90.0
    map_origin_z_m: 0.0
    camera_translation_x_m: 0.12
    camera_translation_y_m: 0.0
    camera_translation_z_m: -0.05
    camera_roll_rad: 0.0
    camera_pitch_rad: 1.570796
    camera_yaw_rad: 0.0

gsi_yolo_target_detector:
  ros__parameters:
    use_sim_time: true
    rgb_topic: /oakd1/rgb/image
    rgb_camera_info_topic: /oakd1/rgb/camera_info
    depth_topic: /oakd1/depth/image
    depth_camera_info_topic: /oakd1/depth/camera_info
    odom_topic: /mavros/local_position/odom
    detections_topic: /gsi/detections
    # A Gazebo semantic/oracle detector can publish here later. When empty,
    # YOLO is the sole positive detector and failures remain visible.
    fallback_detections_topic: ""
    model_path: /tmp/GSI/models/yolo11n.pt
    device: ""
    image_size: 640
    confidence_threshold: 0.20
    iou_threshold: 0.45
    # COCO: car=2, bus=5, truck=7. This avoids class-boundary misses for SUVs.
    vehicle_class_ids: [2, 5, 7]
    target_label: car
    target_entity_id: yellow-search-van
    detection_rate_hz: 5.0
    sensor_timeout_s: 3.0
    depth_window_radius_px: 8
    minimum_depth_m: 0.2
    maximum_depth_m: 90.0
    map_origin_x_m: 42.0
    map_origin_y_m: 90.0
    map_origin_z_m: 0.0
    camera_translation_x_m: 0.12
    camera_translation_y_m: 0.0
    camera_translation_z_m: -0.05
    camera_roll_rad: 0.0
    camera_pitch_rad: 1.570796
    camera_yaw_rad: 0.0
